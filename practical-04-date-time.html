<!DOCTYPE html>

<title>Practical 4 - Date and Time</title>

<body>
<h1>Practical 4: Date and Time</h1>
<p id="output"></p>
<script>
function showDateTime() {
  document.getElementById("output").textContent = new Date().toString();
}
showDateTime();
setInterval(showDateTime, 1000);
</script>
