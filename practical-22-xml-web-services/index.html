<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 22 - XML Web Service</title>
</head>
<body>
<h1>Practical 22: XML Web Service</h1>
<input id="city" value="Pune">
<button onclick="sendRequest()">Send SOAP Request</button>
<pre id="output"></pre>
<script>
function sendRequest() {
  var city = document.getElementById("city").value || "Pune";
  var soap = "<soap:Envelope xmlns:soap='http://schemas.xmlsoap.org/soap/envelope/'><soap:Body><GetWeather xmlns='http://example.com/weather'><city>" + city + "</city></GetWeather></soap:Body></soap:Envelope>";
  fetch("/soap", {
    method: "POST",
    headers: { "Content-Type": "text/xml" },
    body: soap
  }).then(function (response) {
    return response.text();
  }).then(function (text) {
    var xml = new DOMParser().parseFromString(text, "application/xml");
    document.getElementById("output").textContent =
      "Weather in " + xml.getElementsByTagName("city")[0].textContent + ": " +
      xml.getElementsByTagName("temperature")[0].textContent + " " +
      xml.getElementsByTagName("unit")[0].textContent;
  }).catch(function (error) {
    document.getElementById("output").textContent = error.message;
  });
}
</script>
</body>
</html>
