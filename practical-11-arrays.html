<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 11 - Arrays</title>
</head>
<body>
<h1>Practical 11: Arrays</h1>
<script>
var fruits = ["Mango", "Apple", "Banana"];
document.write("Array: " + fruits.join(", ") + "<br>");
fruits.push("Orange");
document.write("push: " + fruits.join(", ") + "<br>");
fruits.pop();
document.write("pop: " + fruits.join(", ") + "<br>");
document.write("length: " + fruits.length + "<br>");
document.write("indexOf Apple: " + fruits.indexOf("Apple") + "<br>");
document.write("map: " + fruits.map(item => item.toUpperCase()).join(", ") + "<br>");
document.write("filter: " + [12, 5, 8, 20].filter(n => n > 7).join(", ") + "<br>");
document.write("reduce: " + [10, 20, 30].reduce((sum, n) => sum + n, 0) + "<br>");
</script>
</body>
</html>
