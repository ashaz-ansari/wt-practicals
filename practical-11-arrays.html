<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 11 - Arrays</title>
</head>
<body>
<h1>Practical 11: Arrays</h1>
<pre id="output"></pre>
<script>
var fruits = ["Mango", "Apple", "Banana"];
var lines = [];
lines.push("Array: " + fruits.join(", "));
fruits.push("Orange");
lines.push("push: " + fruits.join(", "));
fruits.pop();
lines.push("pop: " + fruits.join(", "));
lines.push("length: " + fruits.length);
lines.push("indexOf Apple: " + fruits.indexOf("Apple"));
lines.push("map: " + fruits.map(item => item.toUpperCase()).join(", "));
lines.push("filter: " + [12, 5, 8, 20].filter(n => n > 7).join(", "));
lines.push("reduce: " + [10, 20, 30].reduce((sum, n) => sum + n, 0));
document.getElementById("output").textContent = lines.join("\n");
</script>
</body>
</html>
