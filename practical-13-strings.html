<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 13 - Strings</title>
</head>
<body>
<h1>Practical 13: Strings</h1>
<pre id="output"></pre>
<script>
var text = "  JavaScript makes web pages interactive.  ";
document.getElementById("output").textContent =
  "Original: " + text + "\n" +
  "length: " + text.length + "\n" +
  "trim: " + text.trim() + "\n" +
  "toUpperCase: " + text.toUpperCase() + "\n" +
  "includes web: " + text.includes("web") + "\n" +
  "slice: " + text.slice(2, 12) + "\n" +
  "replace: " + text.replace("interactive", "dynamic") + "\n" +
  "split: " + text.trim().split(" ").join(" | ");
</script>
</body>
</html>
