<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 13 - Strings</title>
</head>
<body>
<h1>Practical 13: Strings</h1>
<script>
var text = "  JavaScript makes web pages interactive.  ";
document.write("Original: " + text + "<br>");
document.write("length: " + text.length + "<br>");
document.write("trim: " + text.trim() + "<br>");
document.write("toUpperCase: " + text.toUpperCase() + "<br>");
document.write("includes web: " + text.includes("web") + "<br>");
document.write("slice: " + text.slice(2, 12) + "<br>");
document.write("replace: " + text.replace("interactive", "dynamic") + "<br>");
document.write("split: " + text.trim().split(" ").join(" | "));
</script>
</body>
</html>
