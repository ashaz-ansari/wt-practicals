<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 18 - AJAX with XMLHttpRequest</title>
</head>
<body>
<h1>Practical 18: AJAX with XMLHttpRequest</h1>
<button onclick="loadStudents()">Load Students</button>
<pre id="output"></pre>
<script>
function loadStudents() {
  var xhr = new XMLHttpRequest();
  var output = document.getElementById("output");
  xhr.open("GET", "students.json", true);
  xhr.onload = function () {
    if (xhr.status === 200) {
      output.textContent = JSON.parse(xhr.responseText).map(function (student) {
        return student.id + " - " + student.name + " - " + student.course + " - " + student.marks;
      }).join("\n");
    } else {
      output.textContent = "Error: " + xhr.status;
    }
  };
  xhr.onerror = function () {
    output.textContent = "Network error";
  };
  output.textContent = "Loading...";
  xhr.send();
}
</script>
</body>
</html>
