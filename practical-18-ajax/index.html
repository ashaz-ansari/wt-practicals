<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practical 18 - AJAX</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main>
<h1>AJAX with XMLHttpRequest</h1>
<p>Load student data from a JSON file without reloading the page.</p>
<button id="loadButton">Load Student Data</button>
<p id="status" class="result">Click the button to load data.</p>
<div id="output"></div>
<p><a href="../index.html">Back to index</a></p>
</main>
<script>
document.getElementById("loadButton").addEventListener("click", function () {
  var xhr = new XMLHttpRequest();
  var status = document.getElementById("status");
  var output = document.getElementById("output");

  status.textContent = "Loading...";
  output.innerHTML = "";

  xhr.open("GET", "students.json", true);

  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        var students = JSON.parse(xhr.responseText);
        var table = "<table><tr><th>ID</th><th>Name</th><th>Course</th><th>Marks</th></tr>";

        students.forEach(function (student) {
          table += "<tr><td>" + student.id + "</td><td>" + student.name + "</td><td>" + student.course + "</td><td>" + student.marks + "</td></tr>";
        });

        table += "</table>";
        output.innerHTML = table;
        status.textContent = "Data loaded successfully using AJAX.";
      } else {
        status.textContent = "Request failed with status " + xhr.status + ".";
      }
    }
  };

  xhr.onerror = function () {
    status.textContent = "Network error while loading the data.";
  };

  xhr.send();
});
</script>
</body>
</html>
