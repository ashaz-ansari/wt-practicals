<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 21 - XML DOM</title>
</head>
<body>
<h1>Practical 21: XML DOM</h1>
<button onclick="addBook()">Add Book</button>
<button onclick="renameBook()">Rename First Book</button>
<button onclick="removeBook()">Remove Last Book</button>
<pre id="output"></pre>
<script>
var xmlData = "<library><book id='1'><title>Web Technology</title></book><book id='2'><title>JavaScript</title></book></library>";
var xml = new DOMParser().parseFromString(xmlData, "application/xml");
function showXml() {
  document.getElementById("output").textContent = new XMLSerializer().serializeToString(xml);
}
function addBook() {
  var book = xml.createElement("book");
  book.setAttribute("id", xml.getElementsByTagName("book").length + 1);
  var title = xml.createElement("title");
  title.textContent = "New Book";
  book.appendChild(title);
  xml.documentElement.appendChild(book);
  showXml();
}
function renameBook() {
  var title = xml.getElementsByTagName("title")[0];
  if (title) title.textContent = "Updated Web Technology";
  showXml();
}
function removeBook() {
  var books = xml.getElementsByTagName("book");
  if (books.length) books[books.length - 1].remove();
  showXml();
}
showXml();
</script>
</body>
</html>
