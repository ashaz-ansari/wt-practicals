<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 17 - Web APIs</title>
</head>
<body>
<h1>Practical 17: Web APIs</h1>
<input id="value" placeholder="Enter a value">
<button onclick="saveValue()">Save</button>
<button onclick="loadValue()">Load</button>
<p id="storage"></p>
<button onclick="getLocation()">Get Location</button>
<p id="location"></p>
<canvas id="canvas" width="300" height="100"></canvas>
<script>
function saveValue() {
  localStorage.setItem("value", document.getElementById("value").value);
  document.getElementById("storage").textContent = "Saved: " + localStorage.getItem("value");
}
function loadValue() {
  document.getElementById("storage").textContent = "Stored: " + (localStorage.getItem("value") || "empty");
}
function getLocation() {
  navigator.geolocation.getCurrentPosition(function (position) {
    document.getElementById("location").textContent = "Latitude: " + position.coords.latitude + ", Longitude: " + position.coords.longitude;
  }, function (error) {
    document.getElementById("location").textContent = error.message;
  });
}
var context = document.getElementById("canvas").getContext("2d");
context.fillRect(10, 10, 100, 50);
context.fillText("Canvas API", 130, 50);
</script>
</body>
</html>
