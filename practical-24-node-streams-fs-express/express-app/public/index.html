<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 24C - Express</title>
</head>
<body>
<h1>Practical 24C: Express Users</h1>
<input id="name" placeholder="New user name">
<button onclick="addUser()">Add User</button>
<button onclick="loadUsers()">Reload Users</button>
<pre id="output"></pre>
<script>
function loadUsers() {
  fetch("/api/users").then(function (response) {
    return response.json();
  }).then(function (users) {
    document.getElementById("output").textContent = JSON.stringify(users, null, 2);
  });
}
function addUser() {
  fetch("/api/users", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: document.getElementById("name").value })
  }).then(function (response) {
    return response.json();
  }).then(loadUsers);
}
loadUsers();
</script>
</body>
</html>
