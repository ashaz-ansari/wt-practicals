<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 22 - XML Web Service</title>
</head>
<body>
<h1>Practical 22: XML Web Service</h1>
<input id="city" value="Pune">
<button onclick="sendRequest()">Send SOAP Request</button>
<pre id="output"></pre>
<script>
var xmlData = "<soap:Envelope xmlns:soap='http://schemas.xmlsoap.org/soap/envelope/'><soap:Body><GetWeatherResponse xmlns='http://example.com/weather'><city>Pune</city><temperature>31</temperature><unit>C</unit></GetWeatherResponse></soap:Body></soap:Envelope>";
function sendRequest() {
  var city = document.getElementById("city").value || "Pune";
  var soapRequest = "<soap:Envelope xmlns:soap='http://schemas.xmlsoap.org/soap/envelope/'><soap:Body><GetWeather xmlns='http://example.com/weather'><city>" + city + "</city></GetWeather></soap:Body></soap:Envelope>";
  var xml = new DOMParser().parseFromString(xmlData.replace("Pune", city), "application/xml");
  document.getElementById("output").textContent =
    "SOAP request:\n" + soapRequest + "\n\nWeather in " +
    xml.getElementsByTagName("city")[0].textContent + ": " +
    xml.getElementsByTagName("temperature")[0].textContent + " " +
    xml.getElementsByTagName("unit")[0].textContent;
}
</script>
</body>
</html>
