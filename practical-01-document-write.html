<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practical 1 - document.write()</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<script>
document.write("<h1>JavaScript document.write()</h1>");
document.write("<p class=\"result\">This page content is generated with document.write().</p>");
document.write("<h2>Numbers and Squares</h2>");
document.write("<table><tr><th>Number</th><th>Square</th></tr>");
for (var i = 1; i <= 10; i++) {
  document.write("<tr><td>" + i + "</td><td>" + (i * i) + "</td></tr>");
}
document.write("</table>");
document.write("<p><a href=\"index.html\">Back to index</a></p>");
</script>
</main>
</body>
</html>
