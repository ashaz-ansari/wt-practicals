<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 3 - Document Object</title>
</head>
<body>
<h1>Practical 3: Document Object</h1>
<pre id="output"></pre>
<script>
var output = document.getElementById("output");
output.textContent =
  "Title: " + document.title + "\n" +
  "URL: " + document.URL + "\n" +
  "Domain: " + document.domain + "\n" +
  "Last modified: " + document.lastModified + "\n" +
  "Heading: " + document.getElementsByTagName("h1")[0].textContent;
</script>
</body>
</html>
