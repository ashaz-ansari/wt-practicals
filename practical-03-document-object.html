<!DOCTYPE html>

<title>Practical 3 - Document Object</title>
</head>
<body>
<h1>Practical 3: Document Object</h1>
<script>
document.write("Title: " + document.title + "<br>");
document.write("URL: " + document.URL + "<br>");
document.write("Domain: " + document.domain + "<br>");
document.write("Last modified: " + document.lastModified + "<br>");
document.write("Heading: " + document.getElementsByTagName("h1")[0].textContent);
</script>
