<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 7 - Fibonacci Numbers</title>
</head>
<body>
<h1>Practical 7: Fibonacci Numbers</h1>
<script>
var first = 0;
var second = 1;
var text = "";
for (var i = 0; i < 10; i++) {
  text += (i ? ", " : "") + first;
  var next = first + second;
  first = second;
  second = next;
}
document.write(text);
</script>
</body>
</html>
