<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 7 - Fibonacci Numbers</title>
</head>
<body>
<h1>Practical 7: Fibonacci Numbers</h1>
<pre id="output"></pre>
<script>
var first = 0;
var second = 1;
var numbers = [];
for (var i = 0; i < 10; i++) {
  numbers.push(first);
  var next = first + second;
  first = second;
  second = next;
}
document.getElementById("output").textContent = numbers.join(", ");
</script>
</body>
</html>
