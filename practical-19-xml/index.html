<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 19 - Simple XML</title>
</head>
<body>
<h1>Practical 19: Simple XML</h1>
<button onclick="loadBooks()">Load Books</button>
<pre id="output"></pre>
<script>
function loadBooks() {
  var xhr = new XMLHttpRequest();
  var output = document.getElementById("output");
  xhr.open("GET", "books.xml", true);
  xhr.onload = function () {
    if (xhr.status === 200) {
      var books = xhr.responseXML.getElementsByTagName("book");
      var lines = [];
      for (var i = 0; i < books.length; i++) {
        lines.push(books[i].getAttribute("id") + " - " + books[i].getElementsByTagName("title")[0].textContent + " - " + books[i].getElementsByTagName("author")[0].textContent + " - " + books[i].getElementsByTagName("price")[0].textContent);
      }
      output.textContent = lines.join("\n");
    } else {
      output.textContent = "Error: " + xhr.status;
    }
  };
  output.textContent = "Loading...";
  xhr.send();
}
</script>
</body>
</html>
