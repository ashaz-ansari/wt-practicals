<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practical 19 - Simple XML</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main>
<h1>Simple XML Program</h1>
<p>Load an XML document, read its elements, and display the parsed data.</p>
<button id="loadButton">Load books.xml</button>
<div id="output"></div>
<p><a href="../index.html">Back to index</a></p>
</main>
<script>
document.getElementById("loadButton").addEventListener("click", function () {
  var xhr = new XMLHttpRequest();
  var output = document.getElementById("output");

  xhr.open("GET", "books.xml", true);

  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        var xml = xhr.responseXML;
        var books = xml.getElementsByTagName("book");
        var html = "<h2>Parsed XML Data</h2><table><tr><th>ID</th><th>Title</th><th>Author</th><th>Price</th></tr>";

        for (var i = 0; i < books.length; i++) {
          var id = books[i].getAttribute("id");
          var title = books[i].getElementsByTagName("title")[0].textContent;
          var author = books[i].getElementsByTagName("author")[0].textContent;
          var price = books[i].getElementsByTagName("price")[0].textContent;
          html += "<tr><td>" + id + "</td><td>" + title + "</td><td>" + author + "</td><td>" + price + "</td></tr>";
        }

        html += "</table>";
        var serialized = new XMLSerializer().serializeToString(xml);
        serialized = serialized.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        html += "<h2>Raw XML</h2><pre>" + serialized + "</pre>";
        output.innerHTML = html;
      } else {
        output.innerHTML = "<p class=\"result\">Unable to load books.xml. Open this page through the local server.</p>";
      }
    }
  };

  xhr.send();
});
</script>
</body>
</html>
