<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 15 - HTML DOM</title>
</head>
<body>
<h1>Practical 15: HTML DOM</h1>
<h2 id="heading">Original heading</h2>
<input id="text" placeholder="Enter text">
<button onclick="changeHeading()">Change Heading</button>
<button onclick="addItem()">Add Item</button>
<ul id="list"><li>First item</li></ul>
<p id="output"></p>
<script>
function changeHeading() {
  document.getElementById("heading").textContent = document.getElementById("text").value || "Original heading";
  document.getElementById("output").textContent = "Heading changed.";
}
function addItem() {
  var item = document.createElement("li");
  item.textContent = "Item " + (document.getElementById("list").children.length + 1);
  document.getElementById("list").appendChild(item);
  document.getElementById("output").textContent = "Item added.";
}
</script>
</body>
</html>
