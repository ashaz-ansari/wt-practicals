<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 12 - Functions</title>
</head>
<body>
<h1>Practical 12: Functions</h1>
<pre id="output"></pre>
<script>
function add(a, b) { return a + b; }
var multiply = function (a, b) { return a * b; };
var divide = (a, b) => a / b;
function greet(name = "Guest") { return "Hello, " + name + "!"; }
function factorial(n) { return n <= 1 ? 1 : n * factorial(n - 1); }
document.getElementById("output").textContent =
  "add: " + add(12, 8) + "\n" +
  "multiply: " + multiply(6, 7) + "\n" +
  "divide: " + divide(20, 4) + "\n" +
  "greet: " + greet() + "\n" +
  "factorial: " + factorial(5);
</script>
</body>
</html>
