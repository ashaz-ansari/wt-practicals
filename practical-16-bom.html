<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 16 - Browser Object Model</title>
</head>
<body>
<h1>Practical 16: Browser Object Model</h1>
<script>
document.write("Window size: " + window.innerWidth + " x " + window.innerHeight + "<br>");
document.write("Screen size: " + screen.width + " x " + screen.height + "<br>");
document.write("Language: " + navigator.language + "<br>");
document.write("Online: " + navigator.onLine + "<br>");
document.write("URL: " + location.href);
function showConfirm() {
  document.getElementById("message").textContent = confirm("Click OK or Cancel") ? "You clicked OK." : "You clicked Cancel.";
}
</script>
<button onclick="showConfirm()">Show Confirm</button>
<p id="message"></p>
</body>
</html>
