<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 16 - Browser Object Model</title>
</head>
<body>
<h1>Practical 16: Browser Object Model</h1>
<pre id="output"></pre>
<button onclick="showConfirm()">Show Confirm</button>
<p id="message"></p>
<script>
document.getElementById("output").textContent =
  "Window size: " + window.innerWidth + " x " + window.innerHeight + "\n" +
  "Screen size: " + screen.width + " x " + screen.height + "\n" +
  "Language: " + navigator.language + "\n" +
  "Online: " + navigator.onLine + "\n" +
  "URL: " + location.href;
function showConfirm() {
  document.getElementById("message").textContent = confirm("Click OK or Cancel") ? "You clicked OK." : "You clicked Cancel.";
}
</script>
</body>
</html>
