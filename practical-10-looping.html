<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 10 - Looping Statements</title>
</head>
<body>
<h1>Practical 10: Looping Statements</h1>
<pre id="output"></pre>
<script>
var lines = [];
for (var i = 1; i <= 3; i++) lines.push("for: " + i);
var j = 1;
while (j <= 3) lines.push("while: " + j++);
var k = 1;
do { lines.push("do...while: " + k++); } while (k <= 3);
for (var fruit of ["Mango", "Apple"]) lines.push("for...of: " + fruit);
for (var key in { name: "Aarav", course: "Web Technology" }) lines.push("for...in: " + key);
document.getElementById("output").textContent = lines.join("\n");
</script>
</body>
</html>
