<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 10 - Looping Statements</title>
</head>
<body>
<h1>Practical 10: Looping Statements</h1>
<script>
for (var i = 1; i <= 3; i++) document.write("for: " + i + "<br>");
var j = 1;
while (j <= 3) document.write("while: " + j++ + "<br>");
var k = 1;
do { document.write("do...while: " + k++ + "<br>"); } while (k <= 3);
for (var fruit of ["Mango", "Apple"]) document.write("for...of: " + fruit + "<br>");
for (var key in { name: "Aarav", course: "Web Technology" }) document.write("for...in: " + key + "<br>");
</script>
</body>
</html>
