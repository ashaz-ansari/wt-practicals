<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 8 - Welcome Function</title>
</head>
<body>
<h1>Practical 8: Welcome Function</h1>
<input id="name" placeholder="Enter your name">
<button onclick="Welcome()">Call Welcome()</button>
<p id="message"></p>
<script>
function Welcome() {
  var name = document.getElementById("name").value || "Guest";
  document.getElementById("message").textContent = "Welcome, " + name + "!";
}
Welcome();
</script>
</body>
</html>
