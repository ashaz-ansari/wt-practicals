<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 14 - Objects and Classes</title>
</head>
<body>
<h1>Practical 14: Objects and Classes</h1>
<pre id="output"></pre>
<script>
var student = {
  name: "Aarav",
  course: "Web Technology",
  display: function () {
    return this.name + " studies " + this.course;
  }
};
class Person {
  constructor(name) {
    this.name = name;
  }
  introduce() {
    return "I am " + this.name;
  }
}
class Student extends Person {
  constructor(name, course) {
    super(name);
    this.course = course;
  }
  introduce() {
    return super.introduce() + " and I study " + this.course;
  }
}
document.getElementById("output").textContent =
  student.display() + "\n" +
  new Person("Meera").introduce() + "\n" +
  new Student("Aarav", "Web Technology").introduce();
</script>
</body>
</html>
