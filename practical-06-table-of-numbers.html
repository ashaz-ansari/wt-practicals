<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 6 - Table of Numbers</title>
</head>
<body>
<h1>Practical 6: Table of Numbers</h1>
<script>
var number = Number(prompt("Enter a number"));
for (var i = 1; i <= 10; i++) {
  document.write(number + " x " + i + " = " + (number * i) + "<br>");
}
</script>
</body>
</html>
