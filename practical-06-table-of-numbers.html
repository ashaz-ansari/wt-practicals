<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 6 - Table of Numbers</title>
</head>
<body>
<h1>Practical 6: Table of Numbers</h1>
<pre id="output"></pre>
<script>
var number = Number(prompt("Enter a number"));
var lines = [];
for (var i = 1; i <= 10; i++) {
  lines.push(number + " x " + i + " = " + (number * i));
}
document.getElementById("output").textContent = lines.join("\n");
</script>
</body>
</html>
