<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Practical 9 - Decision Making</title>
</head>
<body>
<h1>Practical 9: Decision Making</h1>
<button onclick="checkGrade()">Check Grade</button>
<button onclick="checkVowel()">Check Vowel</button>
<p id="output"></p>
<script>
function checkGrade() {
  var marks = Number(prompt("Enter marks"));
  var grade = "F";
  if (marks >= 90) grade = "A+";
  else if (marks >= 80) grade = "A";
  else if (marks >= 70) grade = "B";
  else if (marks >= 60) grade = "C";
  else if (marks >= 40) grade = "D";
  document.getElementById("output").textContent = "Marks: " + marks + ", Grade: " + grade;
}
function checkVowel() {
  var letter = (prompt("Enter a letter") || "").toLowerCase();
  switch (letter) {
    case "a":
    case "e":
    case "i":
    case "o":
    case "u":
      document.getElementById("output").textContent = letter + " is a vowel.";
      break;
    default:
      document.getElementById("output").textContent = letter + " is not a vowel.";
  }
}
</script>
</body>
</html>
